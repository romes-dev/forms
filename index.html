<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite — Pague Menos Imposto e Proteja Sua Renda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --marinho-escuro: #141B3F;
    --marinho: #1E2A5E;
    --dourado: #B8912D;
    --dourado-claro: #D9B45B;
    --papel: #F7F5F1;
    --tinta: #1C2030;
    --tinta-suave: #5A5F72;
    --linha: #E1DDD2;
    --raio: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--papel);
    color: var(--tinta);
    line-height: 1.5;
    padding-bottom: 110px; /* espaço para a barra fixa */
  }
  header {
    background: linear-gradient(160deg, var(--marinho) 0%, var(--marinho-escuro) 100%);
    color: #F1EEE5;
    padding: 20px 20px 24px;
  }
  .idiomas {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 14px;
  }
  .idiomas button {
    background: none;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 3px;
    cursor: pointer;
    line-height: 0;
    opacity: .55;
    transition: opacity .15s, border-color .15s;
  }
  .idiomas button.ativo { opacity: 1; border-color: var(--dourado-claro); }
  .idiomas button:focus-visible { outline: 3px solid rgba(217,180,91,.6); }
  .idiomas svg { width: 34px; height: 24px; border-radius: 4px; display: block; }

  header .convite {
    font-size: 0.8rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dourado-claro);
    margin-bottom: 8px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 650;
    font-size: 1.7rem;
    line-height: 1.2;
  }
  header h1 em { color: var(--dourado-claro); font-style: normal; }
  header p.sub { margin-top: 10px; font-size: 0.9rem; color: #C3C8DC; }

  .detalhes {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(217,180,91,.35);
    display: grid;
    gap: 4px;
    font-size: 0.88rem;
  }
  .detalhes .data { font-weight: 600; color: var(--dourado-claro); }
  .detalhes .local { color: #C3C8DC; }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px; }
  h2 {
    font-family: 'Fraunces', serif;
    font-weight: 650;
    font-size: 1.15rem;
    margin: 18px 0 10px;
    color: var(--marinho);
  }

  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 5px; }
  .campo input {
    width: 100%;
    font: inherit;
    padding: 13px 14px;
    border: 1.5px solid var(--linha);
    border-radius: var(--raio);
    background: #fff;
    color: var(--tinta);
  }
  .campo input:focus {
    outline: 3px solid rgba(30,42,94,.3);
    border-color: var(--marinho);
  }

  .atividade {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: start;
    background: #fff;
    border: 1.5px solid var(--linha);
    border-radius: var(--raio);
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .atividade:has(input:checked) {
    border-color: var(--marinho);
    background: #EFF1F8;
  }
  .atividade:has(input:focus-visible) { outline: 3px solid rgba(30,42,94,.3); }
  .atividade.lotada { opacity: .55; cursor: not-allowed; }
  .atividade input { position: absolute; opacity: 0; pointer-events: none; }

  .hora {
    font-family: 'Fraunces', serif;
    font-weight: 650;
    font-size: 1.1rem;
    color: var(--marinho);
    min-width: 58px;
    white-space: nowrap;
  }
  .info .titulo { font-weight: 600; font-size: 0.95rem; }
  .info .palestrante { font-size: 0.83rem; color: var(--tinta-suave); margin-top: 2px; }

  .vagas {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
    background: #EDF0F9;
    color: var(--marinho);
  }
  .vagas.poucas { background: #F7EDD8; color: var(--dourado); }
  .vagas.zero   { background: #F1E4E2; color: #A0442F; }

  .check {
    grid-column: 1 / -1;
    font-size: 0.8rem;
    color: var(--marinho);
    font-weight: 600;
    display: none;
  }
  .atividade:has(input:checked) .check { display: block; }

  /* Pergunta de múltipla escolha: opções em formato de "pílula" */
  .opcoes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opcao {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.88rem;
    padding: 9px 14px;
    background: #fff;
    border: 1.5px solid var(--linha);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .opcao input { position: absolute; opacity: 0; pointer-events: none; }
  .opcao::before {
    content: '';
    width: 14px; height: 14px;
    border: 1.5px solid #B9B4A6;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .opcao:has(input:checked) {
    border-color: var(--marinho);
    background: var(--marinho);
    color: #fff;
  }
  .opcao:has(input:checked)::before {
    border-color: var(--dourado-claro);
    background: var(--dourado-claro);
    box-shadow: inset 0 0 0 2px var(--marinho);
  }
  .opcao:has(input:focus-visible) { outline: 3px solid rgba(30,42,94,.3); outline-offset: 2px; }

  .barra {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1.5px solid var(--linha);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .barra-inner {
    max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
  }
  .contagem { font-size: 0.85rem; color: var(--tinta-suave); flex: 1; }
  button.enviar {
    font: inherit; font-weight: 600;
    background: var(--marinho);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 13px 24px;
    cursor: pointer;
  }
  button.enviar:disabled { background: #A6AAB9; cursor: not-allowed; }
  button.enviar:focus-visible { outline: 3px solid rgba(30,42,94,.5); outline-offset: 2px; }

  .msg {
    border-radius: var(--raio);
    padding: 13px 14px;
    font-size: 0.9rem;
    margin: 12px 0;
    display: none;
  }
  .msg.erro { display: block; background: #F1E4E2; color: #7A2E1C; }

  .carregando { text-align: center; color: var(--tinta-suave); padding: 30px 0; }

  #confirmacao { display: none; text-align: center; padding: 48px 20px; }
  #confirmacao .selo { font-family: 'Fraunces', serif; font-size: 2.4rem; color: var(--dourado); }
  #confirmacao h2 { font-size: 1.4rem; }
  #confirmacao p { color: var(--tinta-suave); margin-top: 8px; font-size: 0.95rem; }
  #confirmacao button {
    margin-top: 22px; font: inherit; font-weight: 600;
    background: none; border: 1.5px solid var(--marinho);
    color: var(--marinho); border-radius: 999px; padding: 11px 22px; cursor: pointer;
  }

  @media (min-width: 700px) {
    header { text-align: center; }
    header h1 { font-size: 2.1rem; }
    .idiomas { justify-content: flex-end; }
    .detalhes { justify-items: center; }
  }
</style>
</head>
<body>

<header>
  <div class="idiomas" role="group" aria-label="Idioma / Language">
    <button id="btn-pt" class="ativo" aria-label="Português (Brasil)" title="Português">
      <!-- Bandeira do Brasil (simplificada) -->
      <svg viewBox="0 0 34 24" aria-hidden="true">
        <rect width="34" height="24" fill="#009B3A"/>
        <polygon points="17,3 31,12 17,21 3,12" fill="#FEDF00"/>
        <circle cx="17" cy="12" r="5.2" fill="#002776"/>
        <path d="M12.2 11.2 Q17 9.4 21.8 12.4" stroke="#fff" stroke-width="1" fill="none"/>
      </svg>
    </button>
    <button id="btn-en" aria-label="English (US)" title="English">
      <!-- US flag (simplified) -->
      <svg viewBox="0 0 34 24" aria-hidden="true">
        <rect width="34" height="24" fill="#fff"/>
        <g fill="#B22234">
          <rect y="0"    width="34" height="3.43"/>
          <rect y="6.86" width="34" height="3.43"/>
          <rect y="13.7" width="34" height="3.43"/>
          <rect y="20.57" width="34" height="3.43"/>
        </g>
        <rect width="14.5" height="12" fill="#3C3B6E"/>
        <g fill="#fff">
          <circle cx="3" cy="3" r=".9"/><circle cx="7.3" cy="3" r=".9"/><circle cx="11.6" cy="3" r=".9"/>
          <circle cx="5.1" cy="6" r=".9"/><circle cx="9.4" cy="6" r=".9"/>
          <circle cx="3" cy="9" r=".9"/><circle cx="7.3" cy="9" r=".9"/><circle cx="11.6" cy="9" r=".9"/>
        </g>
      </svg>
    </button>
  </div>
  <p class="convite" data-t="convite"></p>
  <h1 id="titulo-evento"></h1>
  <p class="sub" data-t="sub"></p>
  <div class="detalhes">
    <span class="data" data-t="dataEvento"></span>
    <span class="local">Northwestern Mutual · 1515 S Federal Hwy, Suíte 213 — Boca Raton, FL 33432</span>
  </div>
</header>

<main>
  <form id="form" novalidate>
    <h2 data-t="seusDados"></h2>
    <div class="campo">
      <label for="nome" data-t="lblNome"></label>
      <input id="nome" name="nome" type="text" autocomplete="name" required minlength="3">
    </div>
    <div class="campo">
      <label for="telefone" data-t="lblTelefone"></label>
      <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="numeric"
             placeholder="(555) 123-4567" required>
    </div>
    <div class="campo">
      <label for="email" data-t="lblEmail"></label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
             autocapitalize="off" spellcheck="false" placeholder="nome@exemplo.com" required>
    </div>

    <h2 data-t="escolha"></h2>
    <p style="font-size:.85rem;color:var(--tinta-suave);margin-bottom:12px" data-t="hint"></p>
    <div id="lista" class="carregando"></div>

    <fieldset style="border:0;padding:0;margin:0">
      <legend><h2 data-t="motivaTitulo"></h2></legend>
      <p style="font-size:.85rem;color:var(--tinta-suave);margin-bottom:12px" data-t="motivaHint"></p>
      <div class="opcoes" id="interesses"></div>
    </fieldset>

    <div id="msg" class="msg" role="alert"></div>
  </form>

  <section id="confirmacao">
    <div class="selo">✦</div>
    <h2 data-t="confirmada"></h2>
    <p id="resumo"></p>
    <p data-t="nosVemos"></p>
    <button type="button" id="nova" data-t="novaInscricao"></button>
  </section>
</main>

<div class="barra" id="barra">
  <div class="barra-inner">
    <span class="contagem" id="contagem"></span>
    <button class="enviar" id="enviar" disabled form="form" data-t="confirmar"></button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ── CONFIGURE AQUI ────────────────────────────────────────────────
  const SUPABASE_URL = 'https://qvojxddzaejwspehrmwc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_IHD9trVKMRCQyCvEVzDVWA_XH1re1np';
  // ──────────────────────────────────────────────────────────────────

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Opções da pergunta "O que mais motiva você?" ─────────────────
  // O código (1ª coluna) é o que vai para o banco e precisa bater com a
  // lista v_validos da função criar_inscricao. Para mudar só o texto
  // exibido, edite pt/en; para adicionar uma opção, inclua aqui E no SQL.
  const INTERESSES = [
    ['tax_planning',          'Planejamento tributário',                         'Tax Planning'],
    ['holding_company',       'Holding',                                         'Holding Company'],
    ['avoid_taxes',           'Evitar impostos',                                 'Avoid Taxes'],
    ['business_structures',   'Estruturas empresariais',                         'Business Structures'],
    ['retirement',            'Soluções para aposentadoria',                     'Retirement Solutions'],
    ['income_protection',     'Proteção de renda',                               'Income Protection'],
    ['business_planning',     'Análise de planejamento empresarial',             'Business Planning Analysis'],
    ['personal_planning',     'Análise de planejamento pessoal',                 'Personal Planning Analysis'],
    ['life_insurance',        'Seguro de vida',                                  'Life Insurance'],
    ['disability_insurance',  'Seguro contra invalidez',                         'Disability Insurance'],
    ['investment_analysis',   'Análise e serviços de investimentos',             'Investment Analysis & Services'],
    ['investment_management', 'Gestão de investimentos e serviços fiduciários',  'Investment Management & Trust Services'],
    ['career',                'Oportunidade de carreira',                        'Career Opportunity'],
  ];

  // ── i18n ─────────────────────────────────────────────────────────
  const T = {
    pt: {
      convite: 'Convite Especial',
      h1: 'Pague Menos Imposto<br><em>e Proteja Sua Renda</em>',
      sub: 'Degustação gourmet gratuita com especialistas em planejamento financeiro.',
      dataEvento: '10 de novembro às 6:00 PM',
      seusDados: 'Seus dados',
      lblNome: 'Nome completo',
      lblTelefone: 'Telefone',
      lblEmail: 'Email',
      escolha: 'Confirme sua presença',
      hint: 'As vagas são limitadas — selecione a sessão abaixo para reservar a sua.',
      motivaTitulo: 'O que mais motiva você?',
      motivaHint: 'Marque quantas opções quiser.',
      carregando: 'Carregando…',
      erroCarregar: 'Não foi possível carregar o evento. Recarregue a página.',
      esgotado: 'Esgotado',
      vaga: 'vaga', vagas: 'vagas',
      selecionada: '✓ Selecionada',
      nenhuma: 'Nenhuma sessão selecionada',
      selecionadas: (n) => n === 1 ? 'Sessão selecionada' : `${n} sessões selecionadas`,
      confirmar: 'Confirmar presença',
      enviando: 'Enviando…',
      erroNome: 'Informe seu nome completo.',
      erroTelefone: 'Informe um telefone válido: (555) 123-4567.',
      erroEmail: 'Informe um email válido, como nome@exemplo.com.',
      erroAtividade: 'Selecione a sessão para confirmar presença.',
      semVagasExtra: ' — atualize a página para ver as vagas atuais.',
      confirmada: 'Presença confirmada',
      resumo: (nome, lista) => `${nome}, sua presença está confirmada: ${lista}.`,
      nosVemos: 'Nos vemos no dia 10 de novembro!',
      novaInscricao: 'Confirmar outra pessoa',
      htmlLang: 'pt-BR',
    },
    en: {
      convite: 'Special Invitation',
      h1: 'Pay Less Tax<br><em>and Protect Your Income</em>',
      sub: 'Free gourmet tasting with financial planning specialists.',
      dataEvento: 'November 10 at 6:00 PM',
      seusDados: 'Your details',
      lblNome: 'Full name',
      lblTelefone: 'Phone number',
      lblEmail: 'Email',
      escolha: 'Confirm your attendance',
      hint: 'Seats are limited — select the session below to reserve yours.',
      motivaTitulo: 'What motivates you most?',
      motivaHint: 'Select as many as you like.',
      carregando: 'Loading…',
      erroCarregar: 'Could not load the event. Please reload the page.',
      esgotado: 'Sold out',
      vaga: 'seat', vagas: 'seats',
      selecionada: '✓ Selected',
      nenhuma: 'No session selected',
      selecionadas: (n) => n === 1 ? 'Session selected' : `${n} sessions selected`,
      confirmar: 'Confirm attendance',
      enviando: 'Sending…',
      erroNome: 'Please enter your full name.',
      erroTelefone: 'Please enter a valid phone number: (555) 123-4567.',
      erroEmail: 'Please enter a valid email, like name@example.com.',
      erroAtividade: 'Select the session to confirm your attendance.',
      semVagasExtra: ' — reload the page to see current availability.',
      confirmada: 'Attendance confirmed',
      resumo: (nome, lista) => `${nome}, you are confirmed for: ${lista}.`,
      nosVemos: 'See you on November 10!',
      novaInscricao: 'Register someone else',
      htmlLang: 'en',
    },
  };

  let lang = 'pt';
  const t = (k, ...args) => {
    const v = T[lang][k];
    return typeof v === 'function' ? v(...args) : v;
  };

  const lista = document.getElementById('lista');
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('enviar');
  const contagem = document.getElementById('contagem');
  const barra = document.getElementById('barra');
  const confirmacao = document.getElementById('confirmacao');
  const resumo = document.getElementById('resumo');
  const tituloEvento = document.getElementById('titulo-evento');

  let atividades = [];
  let ultimoResumo = null; // { nome, ids } para retraduzir a confirmação

  function tituloDe(a) {
    return (lang === 'en' && a.titulo_en) ? a.titulo_en : a.titulo;
  }

  function aplicarIdioma(novo) {
    lang = novo;
    document.documentElement.lang = T[lang].htmlLang;
    document.getElementById('btn-pt').classList.toggle('ativo', lang === 'pt');
    document.getElementById('btn-en').classList.toggle('ativo', lang === 'en');
    tituloEvento.innerHTML = T[lang].h1; // conteúdo próprio, com <em>
    document.querySelectorAll('[data-t]').forEach(el => {
      el.textContent = t(el.dataset.t);
    });
    if (atividades.length) render(); else lista.textContent = t('carregando');
    renderInteresses();
    document.getElementById('email').placeholder = lang === 'en' ? 'name@example.com' : 'nome@exemplo.com';
    atualizarBarra();
    if (ultimoResumo) {
      const nomes = atividades
        .filter(a => ultimoResumo.ids.includes(a.id))
        .map(a => `${a.horario} · ${tituloDe(a)}`);
      resumo.textContent = t('resumo', ultimoResumo.nome, nomes.join(' — '));
    }
    msg.className = 'msg'; // limpa erro no idioma antigo
  }

  document.getElementById('btn-pt').addEventListener('click', () => aplicarIdioma('pt'));
  document.getElementById('btn-en').addEventListener('click', () => aplicarIdioma('en'));

  // máscara de telefone padrão americano: (XXX) XXX-XXXX
  document.getElementById('telefone').addEventListener('input', (e) => {
    let d = e.target.value.replace(/\D/g, '').slice(0, 10);
    if (d.length > 6)      e.target.value = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
    else if (d.length > 3) e.target.value = `(${d.slice(0,3)}) ${d.slice(3)}`;
    else                   e.target.value = d;
  });

  async function carregar() {
    const { data, error } = await supabase.from('vagas_disponiveis').select('*');
    if (error) {
      console.error('Supabase:', error);
      lista.className = '';
      lista.innerHTML = `<div class="msg erro" style="display:block">${t('erroCarregar')}<br>
        <code style="font-size:.78rem;word-break:break-all">${error.code ?? ''} ${error.message}</code></div>`;
      return;
    }
    atividades = data;
    render();
  }

  function badge(v) {
    if (v <= 0)  return `<span class="vagas zero">${t('esgotado')}</span>`;
    const rotulo = `${v} ${v === 1 ? t('vaga') : t('vagas')}`;
    if (v <= 8)  return `<span class="vagas poucas">${rotulo}</span>`;
    return `<span class="vagas">${rotulo}</span>`;
  }

  function render() {
    const marcadas = new Set(selecionadas());
    lista.className = '';
    lista.innerHTML = atividades.map(a => {
      const lotada = a.vagas_restantes <= 0;
      return `
      <label class="atividade ${lotada ? 'lotada' : ''}">
        <input type="checkbox" name="atividade" value="${a.id}"
               ${lotada ? 'disabled' : ''} ${marcadas.has(a.id) ? 'checked' : ''}>
        <span class="hora">${a.horario}</span>
        <span class="info">
          <span class="titulo">${tituloDe(a)}</span>
          ${a.palestrante ? `<span class="palestrante">${a.palestrante}</span>` : ''}
        </span>
        ${badge(a.vagas_restantes)}
        <span class="check">${t('selecionada')}</span>
      </label>`;
    }).join('');
    atualizarBarra();
  }

  lista.addEventListener('change', () => atualizarBarra());

  function selecionadas() {
    return [...form.querySelectorAll('input[name="atividade"]:checked')].map(i => Number(i.value));
  }

  function interessesMarcados() {
    return [...form.querySelectorAll('input[name="interesse"]:checked')].map(i => i.value);
  }

  // redesenha as opções no idioma atual, mantendo o que já foi marcado
  function renderInteresses() {
    const marcados = new Set(interessesMarcados());
    const col = lang === 'en' ? 2 : 1;
    document.getElementById('interesses').innerHTML = INTERESSES.map(op => `
      <label class="opcao">
        <input type="checkbox" name="interesse" value="${op[0]}" ${marcados.has(op[0]) ? 'checked' : ''}>
        ${op[col]}
      </label>`).join('');
  }

  function atualizarBarra() {
    const n = selecionadas().length;
    contagem.textContent = n === 0 ? t('nenhuma') : t('selecionadas', n);
    btn.disabled = n === 0;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const escolhidas = selecionadas();

    if (nome.length < 3) return erro(t('erroNome'));
    if (telefone.replace(/\D/g, '').length !== 10) return erro(t('erroTelefone'));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return erro(t('erroEmail'));
    if (escolhidas.length === 0) return erro(t('erroAtividade'));

    btn.disabled = true;
    btn.textContent = t('enviando');

    const { error } = await supabase.rpc('criar_inscricao', {
      p_nome: nome,
      p_telefone: telefone,
      p_email: email,
      p_atividades: escolhidas,
      p_interesses: interessesMarcados(),
    });

    btn.textContent = t('confirmar');

    if (error) {
      erro(error.message.includes('Sem vagas') ? error.message + t('semVagasExtra') : error.message);
      btn.disabled = false;
      carregar();
      return;
    }

    ultimoResumo = { nome, ids: escolhidas };
    const nomes = atividades.filter(a => escolhidas.includes(a.id)).map(a => `${a.horario} · ${tituloDe(a)}`);
    resumo.textContent = t('resumo', nome, nomes.join(' — '));
    form.style.display = 'none';
    barra.style.display = 'none';
    confirmacao.style.display = 'block';
    window.scrollTo(0, 0);
  });

  function erro(texto) {
    msg.textContent = texto;
    msg.className = 'msg erro';
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.getElementById('nova').addEventListener('click', () => {
    form.reset();
    ultimoResumo = null;
    form.style.display = '';
    barra.style.display = '';
    confirmacao.style.display = 'none';
    msg.className = 'msg';
    carregar();
    window.scrollTo(0, 0);
  });

  aplicarIdioma('pt');
  carregar();
</script>
</body>
</html>
